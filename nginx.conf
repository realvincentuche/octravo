server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite assets: cache long, they change name on change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Favicon / logo: short cache, served exactly.
  location = /logo.png {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Prerendered pages exist as files; everything else falls back to the SPA.
  location / {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
