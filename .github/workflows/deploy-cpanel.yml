name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: FTP Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP login root is /home/mmbulkqt, so ./octravo/ = /home/mmbulkqt/octravo/
          local-dir: ./dist/
          server-dir: ./octravo/
          # Keep existing files on server; set to true only if you want a clean slate.
          # dangerous-clean-slate: true deletes everything in server-dir first.
          dangerous-clean-slate: false
          # Uncomment if your host requires FTPS / custom port:
          # protocol: ftps
          # port: 21
